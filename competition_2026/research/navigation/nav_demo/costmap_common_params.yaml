#机器人几何参，如果机器人是圆形，设置 robot_radius,如果是其他形状设置 footprint
#robot_radius: 0.12
footprint: [[-0.15, -0.14], [-0.15, 0.14], [0.18, 0.14], [0.19, -0.14]]

obstacle_range: 3.0 # 用于障碍物探测，比如: 值为 3.0，意味着检测到距离小于 3 米的障碍物时，就会引入代价地图
raytrace_range: 3.5 # 用于清除障碍物，比如：值为 3.5，意味着清除代价地图中 3.5 米以外的障碍物

#地图类型
map_type: costmap

#导航包所需要的传感器
# 原来只使用雷达 scan，现在加入深度相机转换得到的 depth_scan
observation_sources: scan depth_scan

# 激光雷达数据
scan: {
  sensor_frame: laser_link,
  data_type: LaserScan,
  topic: scan,
  marking: true,
  clearing: true
}

# 深度相机转换出来的虚拟雷达数据
depth_scan: {
  sensor_frame: camera_depth_frame,
  data_type: LaserScan,
  topic: /depth_scan,
  marking: true,
  clearing: true,
  obstacle_range: 2.0,
  raytrace_range: 2.0,
  inf_is_valid: true
}
