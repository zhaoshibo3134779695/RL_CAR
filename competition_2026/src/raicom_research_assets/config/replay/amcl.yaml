amcl:
  ros__parameters:
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: scan
    laser_max_range: 3.5
    max_beams: 120
    min_particles: 800
    max_particles: 3000
    pf_err: 0.02
    pf_z: 0.99
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    z_hit: 0.75
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.15
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 0.35
    do_beamskip: true
    beam_skip_distance: 0.25
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    update_min_d: 0.35
    update_min_a: 0.6
    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map
    resample_interval: 2
    transform_tolerance: 0.5
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
