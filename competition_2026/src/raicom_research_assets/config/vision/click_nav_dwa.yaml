DWAPlannerROS:
  acc_lim_x: 0.20
  acc_lim_y: 0.20
  acc_lim_th: 0.60

  max_vel_trans: 0.10
  min_vel_trans: 0.00
  max_vel_x: 0.10
  min_vel_x: -0.04
  max_vel_y: 0.08
  min_vel_y: -0.08
  max_vel_theta: 0.30
  min_vel_theta: 0.05

  yaw_goal_tolerance: 0.05
  xy_goal_tolerance: 0.01
  latch_xy_goal_tolerance: false
  trans_stopped_vel: 0.01
  theta_stopped_vel: 0.025

  sim_time: 1.5
  sim_granularity: 0.02
  angular_sim_granularity: 0.025
  vx_samples: 12
  vy_samples: 14
  vth_samples: 16

  path_distance_bias: 50.0
  goal_distance_bias: 20.0
  occdist_scale: 0.80
  forward_point_distance: 0.20
  stop_time_buffer: 0.30
  scaling_speed: 0.08
  max_scaling_factor: 0.20
  publish_cost_grid: false
  oscillation_reset_dist: 0.05
  prune_plan: true
  holonomic_robot: true
