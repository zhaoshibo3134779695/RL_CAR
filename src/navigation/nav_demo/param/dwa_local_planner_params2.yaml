DWAPlannerROS:
  # 完全关闭恢复行为
  recovery_behavior_enabled: false
  clearing_rotation_allowed: false
  recovery_behaviors: []  # 清空恢复行为列表

  # Robot Configuration Parameters - stdr robot
  # 固定的加速度限制（根据你的需求设定）
  acc_lim_x: 0.5
  acc_lim_y: 0.5  # 差分驱动机器人可设为0
  acc_lim_th: 2.0

  # 固定的速度限制（让小车以固定速度运动）
  max_vel_trans: 0.18  # 最大平移速度
  min_vel_trans: 0.18  # 最小平移速度 = 最大平移速度 → 固定速度
  max_vel_x: 0.27      # 最大X方向速度
  min_vel_x: 0.27      # 最小X方向速度 = 最大X方向速度 → 固定X方向速度
  max_vel_y: 0.0       # 差分驱动机器人关闭Y方向速度
  min_vel_y: 0.0
  max_vel_theta: 0.0   # 关闭旋转速度（如需旋转可调整）
  min_vel_theta: 0.0

  # Goal Tolerance Parameters
  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.08
  latch_xy_goal_tolerance: false

  # Forward Simulation Parameters
  # 简化仿真参数，减少计算量
  sim_time: 1.8
  sim_granularity: 0.025
  vx_samples: 10        # X方向速度采样点设为1 → 固定速度
  vy_samples: 10        # Y方向速度采样点设为1 → 固定速度
  vth_samples: 1       # 旋转速度采样点设为1 → 固定旋转速度
  controller_frequency: 10.0  # 控制频率

  # Trajectory Scoring Parameters
  # 弱化避障和路径偏差权重，优先跟随全局路径
  path_distance_bias: 100.0    # 增大路径跟随权重
  goal_distance_bias: 80.0     # 增大目标点跟随权重
  occdist_scale: 0.0           # 关闭避障（如需避障可设小值如0.1）
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.2
  max_scaling_factor: 0.2
  publish_cost_grid: false

  # Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05

  # Global Plan Parameters
  prune_plan: true
  holonomic_robot: false  # 差分驱动机器人设为false
