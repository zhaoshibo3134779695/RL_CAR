TebLocalPlannerROS:

  # --- 1. 机器人速度与加速度限制 ---
  # 直接继承自你的 DWA 配置
  max_vel_x: 0.27
  max_vel_x_backwards: 0.27   # TEB 要求倒车速度写正绝对值，对应你 DWA 的 min_vel_x: -0.27
  max_vel_y: 0.13             # 【关键调整】：如果你的小车是麦克纳姆轮/全向轮，保留 0.13；如果是双轮差速，必须设为 0.0
  max_vel_theta: 0.5
  
  acc_lim_x: 0.5
  acc_lim_y: 0.5              # 同样，差速轮无需管此项，全向轮保留
  acc_lim_theta: 2.0

  # --- 2. 目标点容差 ---
  # 完全继承你的设置
  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.15
  free_goal_vel: false        # 到达目标点时强制速度降为 0

  # --- 3. 障碍物参数 ---
  # TEB 不使用 occdist_scale 这种抽象的比例，而是直接设定物理距离
  min_obstacle_dist: 0.2      # 机器人距离障碍物的最小安全距离(米)，请根据你小车的物理轮廓和膨胀半径调整
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0 # 考虑机器人后方多远的障碍物（倒车时很关键）
  obstacle_poses_affected: 30

  # --- 4. 轨迹配置 ---
  # TEB 不使用 sim_time 和 vx_samples，而是通过时间步长来优化弹性波段
  dt_ref: 0.3                 # 局部路径的期望时间分辨率，0.3 是个很好的默认值
  dt_hysteresis: 0.1          # 允许的时间分辨率波动范围
  global_plan_overwrite_orientation: true
  max_global_plan_lookahead_dist: 3.0 # TEB 往前方看多远的全局路径来进行优化
  feasibility_check_no_poses: 5       # 发送速度指令前，检查未来 5 个姿态会不会碰撞

  # --- 5. 优化权重 (取代 DWA 的 path_distance_bias 等评分) ---
  # 这些权重决定了规划器的“性格”
  weight_optimaltime: 1.0             # 优选耗时最短的路径
  weight_obstacle: 50.0               # 对应你 DWA 里设置的避障优先级，保持较高权重
  weight_viapoint: 1.0                # 贴合全局路径的程度
  
  # --- 6. 运动学约束惩罚 ---
  # 如果允许小车倒车，设为 1.0；如果不希望小车倒车，设为 1000.0 (重度惩罚倒车行为)
  weight_kinematics_forward_drive: 1.0 
  # 【关键调整】：非完整运动学约束。如果是普通双轮差速，设为 1000.0；如果是全向轮，设为 1.0
  weight_kinematics_nh: 1.0
