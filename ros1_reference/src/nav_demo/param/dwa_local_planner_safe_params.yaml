DWAPlannerROS:
  recovery_behavior_enabled: false
  clearing_rotation_allowed: false

  acc_lim_x: 0.50
  acc_lim_y: 0.25
  acc_lim_th: 2.00
  acc_lim_trans: 0.50
  acc_lim_theta: 2.00

  max_vel_trans: 0.35
  min_vel_trans: 0.04

  max_vel_x: 0.38
  min_vel_x: 0.00
  max_vel_y: 0.00
  min_vel_y: 0.00

  max_vel_theta: 0.40
  min_vel_theta: 0.02
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.02

  yaw_goal_tolerance: 0.10
  xy_goal_tolerance: 0.03
  latch_xy_goal_tolerance: true

  sim_time: 1.2
  sim_granularity: 0.02
  vx_samples: 20
  vy_samples: 1
  vth_samples: 21

  path_distance_bias: 45.0
  goal_distance_bias: 28.0
  occdist_scale: 0.25
  forward_point_distance: 0.12
  stop_time_buffer: 0.15
  scaling_speed: 0.20
  max_scaling_factor: 0.0
  publish_cost_grid: false

  oscillation_reset_dist: 0.02
  oscillation_reset_angle: 0.2
  prune_plan: true
  holonomic_robot: true
  penalize_negative_x: true
