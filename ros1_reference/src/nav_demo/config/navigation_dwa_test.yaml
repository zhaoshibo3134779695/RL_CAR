DWAPlannerROS:
  cheat_factor: 4.0
  acc_lim_th: 2.0
  acc_lim_theta: 2.0
  acc_lim_trans: 0.5
  acc_lim_x: 0.5
  acc_lim_y: 0.25
  clearing_rotation_allowed: false
  forward_point_distance: 0.15
  goal_distance_bias: 8.0
  holonomic_robot: true
  latch_xy_goal_tolerance: true
  # Native DWA speed-dependent footprint expansion; static costmaps unchanged.
  max_scaling_factor: 0.3
  max_vel_theta: 0.50
  max_vel_trans: 0.3
  max_vel_x: 0.3
  max_vel_y: 0.06
  min_vel_theta: 0.05
  min_vel_trans: 0.01
  # Allow slow backing out when a turn has limited clearance.
  min_vel_x: -0.12
  min_vel_y: -0.06
  # Soft obstacle score weight; footprint collision rejection remains enabled.
  occdist_scale: 0.02
  odom_topic: /odom
  oscillation_reset_angle: 0.2
  oscillation_reset_dist: 0.02
  path_distance_bias: 90.0
  penalize_negative_x: true
  prune_plan: true
  publish_cost_grid: false
  publish_traj_pc: false
  recovery_behavior_enabled: false
  scaling_speed: 0.08
  angular_sim_granularity: 0.025
  sim_granularity: 0.01
  # Shorter rollout reduced corner tracking error in the 0.30 m/s tests.
  sim_time: 1.0
  stop_time_buffer: 0.15
  theta_stopped_vel: 0.02
  trans_stopped_vel: 0.02
  twirling_scale: 0.0
  vth_samples: 31
  vx_samples: 20
  vy_samples: 5
  xy_goal_tolerance: 0.03
  yaw_goal_tolerance: 0.1
GlobalPlanner:
  allow_unknown: false
  cost_factor: 3.0
  default_tolerance: 0.0
  lethal_cost: 253
  neutral_cost: 50
  old_navfn_behavior: false
  orientation_mode: 0
  orientation_window_size: 1
  publish_potential: true
  use_dijkstra: true
  use_grid_path: false
  use_quadratic: true
  visualize_potential: false
base_global_planner: global_planner/GlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS
clearing_rotation_allowed: false
controller_frequency: 10.0
controller_patience: 5.0
global_costmap:
  always_send_full_costmap: true
  cost_scaling_factor: 20.0
  footprint:
  - - -0.194
    - -0.064
  - - -0.171
    - -0.142
  - - 0.131
    - -0.142
  - - 0.144
    - -0.07
  - - 0.144
    - 0.091
  - - 0.131
    - 0.162
  - - -0.171
    - 0.162
  - - -0.194
    - 0.086
  footprint_padding: 0.005
  global_frame: map
  inflation_layer:
    cost_scaling_factor: 20.0
    # User-selected global path test: 30 cm inflation with decay factor 20.
    inflation_radius: 0.30
  inflation_radius: 0.30
  plugins:
  - name: static_layer
    type: costmap_2d::StaticLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  publish_frequency: 1.0
  resolution: 0.005
  robot_base_frame: base_footprint
  static_layer:
    map_topic: /forbidden_map
    subscribe_to_updates: false
  transform_tolerance: 0.5
  update_frequency: 1.0
local_costmap:
  always_send_full_costmap: true
  cost_scaling_factor: 20.0
  footprint:
  - - -0.194
    - -0.064
  - - -0.171
    - -0.142
  - - 0.131
    - -0.142
  - - 0.144
    - -0.07
  - - 0.144
    - 0.091
  - - 0.131
    - 0.162
  - - -0.171
    - 0.162
  - - -0.194
    - 0.086
  footprint_padding: 0.005
  global_frame: odom
  height: 2.0
  inflation_layer:
    cost_scaling_factor: 20.0
    # Match global inflation for the user-selected navigation test.
    inflation_radius: 0.30
  inflation_radius: 0.30
  plugins:
  - name: static_layer
    type: costmap_2d::StaticLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  publish_frequency: 5.0
  resolution: 0.005
  robot_base_frame: base_footprint
  rolling_window: true
  static_layer:
    map_topic: /forbidden_map
    subscribe_to_updates: false
  transform_tolerance: 0.5
  update_frequency: 6.0
  width: 3.0
oscillation_distance: 0.02
oscillation_timeout: 20.0
planner_frequency: 1.0
planner_patience: 5.0
recovery_behavior_enabled: false
recovery_behaviors:
- name: reset_recovery
  type: clear_costmap_recovery/ClearCostmapRecovery
reset_recovery:
  layer_names:
  - obstacle_layer
  reset_distance: 0.4
shutdown_costmaps: false
