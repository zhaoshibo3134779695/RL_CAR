  detection_mode: left_only
  row_step_px: 8
  row_band_half_height_px: 3
  minimum_row_pixels: 7
  minimum_boundary_gap_px: 35
  row_assignment_mode: perspective_sides
  perspective_center_exclusion_px: 70.0
  row_tracking_max_jump_px: 72.0
  row_tracking_max_gap_rows: 1
  row_tracking_velocity_alpha: 0.5
  use_previous_reference_center: false
  enforce_perspective_side_direction: true
  perspective_direction_slope_tolerance: 0.15
  minimum_fit_points: 6
  polynomial_degree: 1
  robust_fit_iterations: 3
  fit_outlier_px: 18.0
  smoothing_alpha: 1.0
  lane_width_alpha: 0.08
  initial_lane_width_px: 0.0
  minimum_lane_width_px: 80.0
  maximum_lane_width_px: 900.0
  single_side_hold_frames: 0
  both_side_stop_frames: 3
  minimum_quality: 0.25
disk_detection:
  minimum_contour_area_px: 30.0
  maximum_contour_area_px: 120000.0
  minimum_circularity: 0.03
  minimum_axis_ratio: 0.08
  minimum_minor_axis_px: 2.5
  maximum_major_axis_px: 180.0
  # A far 0.10 m disc is compressed to about 33x6 px and its two visible red
  # arcs are separated horizontally. Join only that short horizontal gap when
  # forming proposals; validation below still requires white/neutral centre,
  # concentricity, physical diameter and metric lane geometry.
  proposal_red_close_kernel_x: 27
  proposal_red_close_kernel_y: 3
  minimum_white_candidate_area_px: 8.0
  maximum_white_candidate_area_px: 6000.0
  minimum_red_pixels_near_white_proposal: 5
  white_outer_scale_hypotheses:
  - 1.0
  - 1.45
  - 2.0
  - 2.4
  annulus_inner_ratio: 0.48
  annulus_outer_ratio: 1.08
  center_ratio: 0.4
  minimum_red_annulus_ratio: 0.3
  ring_sector_count: 20
  minimum_sector_red_ratio: 0.12
  minimum_ring_sector_coverage: 0.5
  maximum_missing_sector_fraction: 0.35
  center_max_saturation: 45
  center_lab_neutral_tolerance: 14
  minimum_neutral_center_ratio: 0.65
  minimum_center_brightness_contrast: 8.0
  full_center_brightness_contrast: 35.0
  minimum_white_center_ratio: 0.15
  maximum_red_center_ratio: 0.3
  # At long range the neutral white centre is only a few pixels high. Low
  # saturation makes some of those pixels pass the red HSV mask, so recover a
  # candidate only when a strong ring, neutral bright centre, high contrast,
  # and tight concentricity all agree.
  strong_ring_recovery_enabled: true
  strong_ring_recovery_maximum_red_center_ratio: 1.0
  strong_ring_recovery_minimum_red_annulus_ratio: 0.45
  strong_ring_recovery_minimum_sector_coverage: 0.65
  strong_ring_recovery_minimum_neutral_center_ratio: 0.95
  strong_ring_recovery_minimum_center_contrast: 50.0
  strong_ring_recovery_maximum_center_offset_px: 2.5
  # At the far end of Stage 1 the 0.10 m disc is only about four image pixels
  # high. Perspective compression leaves a partial red band rather than a
  # complete annulus. Recover only a small, foreshortened white-centre proposal
  # when red support, neutral/bright centre and concentricity all agree.
  far_white_center_recovery_enabled: true
  far_white_center_recovery_minimum_major_axis_px: 12.0
  far_white_center_recovery_maximum_major_axis_px: 32.0
  far_white_center_recovery_maximum_minor_axis_px: 10.0
  far_white_center_recovery_minimum_axis_ratio: 0.12
  far_white_center_recovery_maximum_axis_ratio: 0.50
  # Field cold-start measurements place the far disc's weakest valid frames
  # around 11 nearby red pixels, 0.091 annulus support and 0.25 sector
  # coverage.  Keep this relaxation confined to the small, foreshortened,
  # neutral-white-centred and tightly concentric recovery branch.
  far_white_center_recovery_minimum_nearby_red_pixels: 8
  far_white_center_recovery_minimum_red_annulus_ratio: 0.02
  far_white_center_recovery_minimum_sector_coverage: 0.10
  far_white_center_recovery_maximum_missing_sector_fraction: 0.90
  far_white_center_recovery_minimum_neutral_center_ratio: 0.80
  far_white_center_recovery_minimum_white_center_ratio: 0.60
  # The centre already has to satisfy the V>=190 white mask. At four-pixel
  # height its median can equal the grey floor, so contrast is not reliable.
  far_white_center_recovery_minimum_center_contrast: 0.0
  far_white_center_recovery_maximum_red_center_ratio: 0.40
  far_white_center_recovery_maximum_center_offset_px: 5.0
  far_white_center_recovery_confidence_threshold: 0.32
  # Exposure alternation sometimes produces a partial red-ring proposal for
  # the same far disc. This path reuses the strict far-size geometry and also
  # requires a neutral white centre and tight red/white concentricity.
  far_red_ring_recovery_enabled: true
  far_red_ring_recovery_minimum_major_axis_px: 12.0
  far_red_ring_recovery_maximum_major_axis_px: 38.0
  far_red_ring_recovery_maximum_minor_axis_px: 12.0
  far_red_ring_recovery_minimum_axis_ratio: 0.12
  far_red_ring_recovery_maximum_axis_ratio: 0.55
  far_red_ring_recovery_minimum_red_annulus_ratio: 0.18
  far_red_ring_recovery_minimum_sector_coverage: 0.25
  far_red_ring_recovery_maximum_missing_sector_fraction: 0.50
  far_red_ring_recovery_minimum_neutral_center_ratio: 0.80
  far_red_ring_recovery_minimum_white_center_ratio: 0.55
  far_red_ring_recovery_minimum_center_contrast: 8.0
  far_red_ring_recovery_maximum_red_center_ratio: 0.80
  far_red_ring_recovery_maximum_center_offset_px: 3.2
  far_recovery_maximum_projected_diameter_m: 0.18
  maximum_center_offset_fraction: 0.35
  minimum_center_offset_limit_px: 4.0
  lane_filter_enabled: true
  lane_center_margin_px: 20.0
  outer_contours_only: true
  hierarchy_bonus: 0.08
  confidence_threshold: 0.496
  dedup_center_fraction: 0.32
  cross_view_dedup_distance_m: 0.06
  tracking_match_distance_m: 0.3
  # The far Stage-1 disc is only a few pixels high. Camera commissioning
  # already requires two consecutive complete-scene detections, so use the
  # same two-frame temporal gate for the mission tracker instead of requiring
  # a third intermittent far-disc observation.
  confirmation_frames: 2
  allowed_missed_frames: 4
  track_timeout_sec: 0.8
  position_smoothing_alpha: 0.45
  minimum_projected_diameter_m: 0.055
  maximum_projected_diameter_m: 0.15
  # A far 100 mm disc is only 1--3 source pixels high, so single-frame image
  # ellipse fitting is intermittent even when colour segmentation is correct.
  # Use the calibrated metric BEV only as a far-range fallback: a white centre
  # must be surrounded by red evidence at the known physical disc radius.
  # Near discs still use the full strict image-space detector above.
  bev_far_fallback_enabled: true
  bev_far_fallback_minimum_forward_from_base_m: 0.90
  bev_far_fallback_maximum_forward_from_base_m: 1.95
  bev_far_fallback_maximum_abs_lateral_m: 0.52
  # Accumulate only five stationary ACQUIRE frames. This bridges MJPEG/red
  # mask flicker without carrying evidence into navigation or across reset.
  bev_far_fallback_temporal_red_frames: 5
  bev_far_fallback_proposal_close_kernel_x: 27
  bev_far_fallback_proposal_close_kernel_y: 3
  bev_far_fallback_minimum_proposal_area_px: 2.0
  bev_far_fallback_maximum_proposal_area_px: 500.0
  bev_far_fallback_minimum_proposal_width_px: 8
  bev_far_fallback_maximum_proposal_width_px: 65
  bev_far_fallback_maximum_proposal_height_px: 18
  bev_far_fallback_annulus_inner_ratio: 0.40
  bev_far_fallback_annulus_outer_ratio: 1.40
  bev_far_fallback_center_ratio: 0.65
  bev_far_fallback_minimum_red_pixels: 30
  bev_far_fallback_minimum_white_center_ratio: 0.20
  # Cold-start A/B: valid far-disc centre-minus-annulus contrast spans
  # 10--15 levels after exposure latching; 10 retains the complete-scene
  # evidence while rejecting the flat grey-floor red fragment.
  bev_far_fallback_minimum_center_contrast: 10.0
  bev_far_fallback_sector_count: 8
  bev_far_fallback_minimum_red_pixels_per_sector: 5
  bev_far_fallback_minimum_supported_sectors: 2
  bev_far_fallback_maximum_candidates: 2
  # Legacy bounded extrapolation remains as a safety fallback. The formal BEV
  # canvas now already spans base_link forward 0..2 m, so ordinary visible
  # close discs are expected to lie inside the canvas.
  allow_near_field_ground_extrapolation: true
  near_field_minimum_forward_from_base_m: 0.22
  near_field_maximum_forward_from_base_m: 0.60
  # The detector segments the printed red ring, whose fitted outer contour is
  # smaller than the complete 0.10 m physical disc.  This optical ratio only
  # corrects the reported/filter diameter; obstacle geometry remains the fixed
  # physical 0.05 m radius and disc centers are not rescaled.
  projected_diameter_mode: geometric_mean_ground_spans
  visible_ring_to_physical_diameter_ratio: 0.922076
